[project]
name = "tender-matic-prototype"
version = "0.1.0"
description = "Tender-matic supervised prototype"
requires-python = ">=3.12"
dependencies = [
	"pypdf>=5.0",
	"python-docx>=1.1",
]

[project.optional-dependencies]
test = ["reportlab>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"